<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe Game</title>
  <!-- Google Fonts for Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Header Section -->
    <header class="game-header">
      <h1 class="game-title">Tic-Tac-Toe</h1>
      <p class="game-subtitle">Classic 2-Player Strategy Game</p>
    </header>

    <!-- Scoreboard Section -->
    <section class="scoreboard" aria-label="Game Scoreboard">
      <div class="score-card player-x-card">
        <span class="score-label">Player X</span>
        <span class="score-value" id="score-x">0</span>
      </div>
      <div class="score-card tie-card">
        <span class="score-label">Ties</span>
        <span class="score-value" id="score-ties">0</span>
      </div>
      <div class="score-card player-o-card">
        <span class="score-label">Player O</span>
        <span class="score-value" id="score-o">0</span>
      </div>
    </section>

    <!-- Turn & Status Banner -->
    <div class="status-container" aria-live="polite">
      <div class="status-badge" id="status-message">
        Player <span class="current-turn-indicator turn-x">X</span>'s Turn
      </div>
    </div>

    <!-- 3x3 Tic-Tac-Toe Game Board -->
    <main class="board-container">
      <div class="game-board" id="game-board" role="grid" aria-label="Tic-Tac-Toe Board">
        <button class="cell" data-index="0" role="gridcell" aria-label="Cell 1"></button>
        <button class="cell" data-index="1" role="gridcell" aria-label="Cell 2"></button>
        <button class="cell" data-index="2" role="gridcell" aria-label="Cell 3"></button>
        <button class="cell" data-index="3" role="gridcell" aria-label="Cell 4"></button>
        <button class="cell" data-index="4" role="gridcell" aria-label="Cell 5"></button>
        <button class="cell" data-index="5" role="gridcell" aria-label="Cell 6"></button>
        <button class="cell" data-index="6" role="gridcell" aria-label="Cell 7"></button>
        <button class="cell" data-index="7" role="gridcell" aria-label="Cell 8"></button>
        <button class="cell" data-index="8" role="gridcell" aria-label="Cell 9"></button>
      </div>
    </main>

    <!-- Action Controls -->
    <footer class="controls-container">
      <button class="btn btn-primary" id="restart-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        New Game
      </button>
      <button class="btn btn-secondary" id="reset-scores-btn">
        Reset Scores
      </button>
    </footer>
  </div>

  <!-- Game Logic Script -->
  <script src="script.js"></script>
</body>
</html>
